# ============================================================
#  Banking Management System — Application Configuration
#  Vaibhavi Shingade | Spring Boot 3.x | PostgreSQL
# ============================================================

# ---------------------------------------------------------------
# Active Profile (Defaults to 'h2' for instant 1-click local running)
# Set SPRING_PROFILES_ACTIVE=postgres to switch to PostgreSQL mode.
# ---------------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------
# PostgreSQL DataSource
# Use environment variables in production. For local dev, you can
# replace ${DB_PASSWORD} with your actual postgres password.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update  → Hibernate creates/updates tables automatically.
#                    Use 'validate' in production.
# show-sql=true    → Logs every SQL query (great for learning).
# format_sql=true  → Pretty-prints SQL for readability.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------
# Jackson (JSON serialization)
# ---------------------------------------------------------------
# Do not serialize null fields in API responses
spring.jackson.default-property-inclusion=non_null
# Human-readable timestamp format
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------
# Application-specific settings
# ---------------------------------------------------------------
# Initial balance for every new bank account (BigDecimal-safe string)
banking.account.initial-balance=0.00

# Prefix for generated account numbers (e.g., ACC100001)
banking.account.number-prefix=ACC

# Prefix for generated transaction references (e.g., TXN100001)
banking.transaction.reference-prefix=TXN

# ---------------------------------------------------------------
# Logging
# ---------------------------------------------------------------
logging.level.com.prasad.banking=DEBUG
logging.level.org.springframework.transaction=DEBUG
